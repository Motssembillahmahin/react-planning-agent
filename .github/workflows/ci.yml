name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --locked

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src/react_agent

      - name: Pytest with coverage
        run: uv run pytest --cov=react_agent --cov-report=term-missing --cov-fail-under=90

      - name: Deterministic eval (ScriptedLLM, no network)
        run: make eval

      - name: Eval results are reproducible
        run: git diff --exit-code -- evals/results.md evals/results.json
